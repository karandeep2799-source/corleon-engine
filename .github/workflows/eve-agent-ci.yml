name: Eve agent CI

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/sanity-copilot/**"
      - "docs/architecture/eve-agent-integration.md"
      - ".github/workflows/eve-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "agents/sanity-copilot/**"
      - "docs/architecture/eve-agent-integration.md"
      - ".github/workflows/eve-agent-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/sanity-copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build agent
        run: pnpm build
