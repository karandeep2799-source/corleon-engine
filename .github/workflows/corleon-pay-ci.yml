name: Corleon Pay CI

on:
  push:
    branches: [feat/corleon-pay-shared-player]
  pull_request:
    branches: [feat/production-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @corleon/web prisma:generate
      - name: Typecheck web
        run: pnpm --filter @corleon/web typecheck
      - name: Test web
        run: pnpm --filter @corleon/web test
      - name: Build web
        run: pnpm --filter @corleon/web build
