name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run workspace tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Upload generated lockfile for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: corleon-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
