name: CI
on:
  push:
    branches: [main, feat/images-api]
  pull_request:
    branches: [main, feat/production-foundation]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @corleon/web db:generate
      - run: pnpm typecheck
      - run: pnpm --filter @corleon/web test
      - run: pnpm turbo build --filter=@corleon/web
