name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corleon
          POSTGRES_PASSWORD: corleon
          POSTGRES_DB: corleon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corleon -d corleon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://corleon:corleon@localhost:5432/corleon_test
      RAZORPAY_KEY_SECRET: ci-test-secret
      RAZORPAY_WEBHOOK_SECRET: ci-test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma format --check
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
