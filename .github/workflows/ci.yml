name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corleon
          POSTGRES_PASSWORD: corleon
          POSTGRES_DB: corleon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corleon -d corleon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://corleon:corleon@localhost:5432/corleon_test
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-test-secret
      RAZORPAY_WEBHOOK_SECRET: ci-test-webhook-secret
      PAYMENTS_ENABLED: "false"
      RAZORPAY_CHECKOUT_ENABLED: "false"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma format
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma db push --skip-generate
      - run: pnpm exec prisma generate
      - run: pnpm --filter @corleon/web typecheck
      - run: pnpm --filter @corleon/web lint
      - run: pnpm --filter @corleon/web test
      - run: pnpm build
