# Project-scoped Codex configuration. Codex loads this file only for trusted projects.
# The upstream browser server runs locally over stdio; production agents use Corleon's gateway.

[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "--yes",
  "chrome-devtools-mcp@1.12.0",
  "--config=config/mcp/chrome-devtools-server.json",
  "--no-javascript-evaluation",
  "--no-usage-statistics",
  "--no-update-checks",
  "--no-performance-crux"
]
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"
enabled_tools = [
  "list_pages",
  "take_snapshot",
  "take_screenshot",
  "list_console_messages",
  "get_console_message",
  "get_css_styles",
  "list_network_requests",
  "get_network_request",
  "performance_analyze_insight",
  "performance_start_trace",
  "performance_stop_trace",
  "lighthouse_audit",
  "navigate_page",
  "new_page",
  "close_page",
  "select_page",
  "wait_for"
]
