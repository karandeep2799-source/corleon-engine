<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corleon | AI Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #020617; color: #f8fafc; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #0f172a; padding: 2rem; border-right: 1px solid #1e293b; }
        .sidebar h2 { color: #38bdf8; margin-bottom: 2rem; letter-spacing: 1px; cursor: pointer;}
        .tool-link { display: block; padding: 10px; margin-bottom: 10px; background-color: #1e293b; border-radius: 5px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .tool-link.active, .tool-link:hover { border-color: #38bdf8; background-color: #0f172a; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 2rem; }
        .chat-box { flex-grow: 1; background-color: #0f172a; border-radius: 10px; border: 1px solid #1e293b; padding: 2rem; overflow-y: auto; margin-bottom: 2rem; }
        .message { margin-bottom: 1.5rem; }
        .user-message { color: #38bdf8; font-weight: bold; }
        .ai-message { color: #cbd5e1; margin-top: 5px; white-space: pre-wrap; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 15px; border-radius: 5px; border: 1px solid #334155; background-color: #1e293b; color: white; outline: none; font-size: 1rem; }
        button { background-color: #38bdf8; color: #020617; border: none; padding: 0 25px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem;}
        button:hover { background-color: #0284c7; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 onclick="window.location.href='/'">CORLEON</h2>
        <div class="tool-link active">Text Generation</div>
        <div class="tool-link">Image Generation (Pro)</div>
    </div>
    <div class="main-content">
        <div class="chat-box" id="chatBox">
            <div class="message"><div class="user-message">Corleon AI:</div><div class="ai-message">Welcome to the engine. How can I assist you today?</div></div>
        </div>
        <div class="input-group">
            <input type="text" id="promptInput" placeholder="Type your prompt here..." onkeypress="if(event.key === 'Enter') generateAI()">
            <button onclick="generateAI()">Generate</button>
        </div>
    </div>

    <script>
        async function generateAI() {
            const input = document.getElementById('promptInput');
            const chatBox = document.getElementById('chatBox');
            const prompt = input.value;
            if (!prompt) return;

            chatBox.innerHTML += `<div class="message"><div class="user-message">You:</div><div class="ai-message">${prompt}</div></div>`;
            input.value = ''; 
            
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message" id="${loadingId}"><div class="user-message" style="color: #94a3b8;">Corleon AI:</div><div class="ai-message">Processing...</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Notice this is now a RELATIVE path. This is what makes it work on the web!
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                document.getElementById(loadingId).innerHTML = `<div class="user-message">Corleon AI:</div><div class="ai-message">${data.result}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).innerHTML = `<div class="user-message" style="color: red;">Error:</div><div class="ai-message">System failure. Could not reach servers.</div>`;
            }
        }
    </script>
</body>
</html>
