# Local/staging reference only. Production orchestration must launch one worker
# container per task/session and bind stdio to an authenticated Corleon gateway.
services:
  egress-proxy:
    build:
      context: ./services/egress-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=13,gid=13
      - /var/spool/squid:size=64m,uid=13,gid=13
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      browser-private:
        ipv4_address: 172.31.0.2
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3128'"]
      interval: 30s
      timeout: 5s
      retries: 3

  browser-worker:
    build:
      context: .
      dockerfile: services/browser-worker/Dockerfile
    init: true
    stdin_open: true
    tty: false
    read_only: true
    restart: "no"
    tmpfs:
      - /tmp:size=256m,exec,nosuid,nodev
      - /home/node/.cache:size=128m,exec,nosuid,nodev,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    shm_size: 512m
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      - browser-private
    environment:
      NODE_ENV: production
      CHROME_DEVTOOLS_MCP_NO_CONFIG_DISCOVERY: "1"
    command:
      - --config=/etc/corleon/chrome-devtools.json
      - --headless=true
      - --isolated=true
      - --page-id-routing=true
      - --no-javascript-evaluation
      - --no-usage-statistics
      - --no-update-checks
      - --no-performance-crux

networks:
  browser-private:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  egress:
    driver: bridge
